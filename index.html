<script>
/* =========================================================
   LIEN D'INSCRIPTION PUBLIQUE
   ========================================================= */

function obtenirLienInscription(organisation, numeroOrganisation) {

    const baseURL = window.location.origin + window.location.pathname;

    return baseURL
        + "?inscription=1"
        + "&organisation=" + encodeURIComponent(organisation)
        + "&numeroOrganisation=" + encodeURIComponent(numeroOrganisation);
}


/* =========================================================
   COPIER LE LIEN
   ========================================================= */

function copierLienInscription(organisation, numeroOrganisation) {

    const lien = obtenirLienInscription(
        organisation,
        numeroOrganisation
    );

    navigator.clipboard.writeText(lien)
        .then(function () {

            alert(
                "✅ Lien copié avec succès !\n\n" +
                "Vous pouvez maintenant le coller dans WhatsApp, SMS ou Messenger."
            );

        })
        .catch(function () {

            const zone = document.createElement("textarea");

            zone.value = lien;
            document.body.appendChild(zone);

            zone.select();
            document.execCommand("copy");

            document.body.removeChild(zone);

            alert(
                "✅ Lien copié avec succès !\n\n" +
                "Vous pouvez maintenant le partager."
            );
        });
}


/* =========================================================
   OUVRIR LE LIEN
   ========================================================= */

function ouvrirLienInscription(organisation, numeroOrganisation) {

    const lien = obtenirLienInscription(
        organisation,
        numeroOrganisation
    );

    window.open(lien, "_blank");
}


/* =========================================================
   PARTAGER LE LIEN
   ========================================================= */

function partagerLienInscription(organisation, numeroOrganisation) {

    const lien = obtenirLienInscription(
        organisation,
        numeroOrganisation
    );

    const texte =
        "🌐 INSCRIPTION EN LIGNE\n\n" +
        "Vous pouvez vous inscrire ici :\n" +
        lien;

    /* Téléphone / navigateur compatible */
    if (navigator.share) {

        navigator.share({
            title: "Inscription en ligne",
            text: texte,
            url: lien
        })
        .catch(function () {
            // L'utilisateur a simplement annulé le partage
        });

    } else {

        /* Ordinateur : on copie automatiquement le lien */
        navigator.clipboard.writeText(lien)
            .then(function () {

                alert(
                    "✅ Le lien a été copié !\n\n" +
                    "Collez-le maintenant dans WhatsApp, Messenger, SMS ou votre e-mail."
                );

            })
            .catch(function () {

                prompt(
                    "Copiez ce lien pour le partager :",
                    lien
                );

            });
    }
}
</script>
